name: Sign exact Zhirox v5.1.16 Relay candidate (owner only, NO DEPLOY)

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sign-v5116-exact-proof.yml'
      - 'tools/sign_v5116_exact.go'
      - 'tools/sign_v5116_exact_test.go'
      - 'release-candidates/v5.1.16/manifest.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/sign-v5116-exact-proof.yml'
      - 'tools/sign_v5116_exact.go'
      - 'tools/sign_v5116_exact_test.go'
      - 'release-candidates/v5.1.16/manifest.json'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Owner-only: type SIGN-ONLY-v5.1.16-6f3d4fa4. This signs ONLY the pinned candidate, does not install or publish.'
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  test-unsigned-proof-contract:
    name: Verify signing safety contract without secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Execute exact-candidate tests (no seed)
        run: |
          set -euo pipefail
          go test -v tools/sign_v5116_exact.go tools/sign_v5116_exact_test.go
          go build -o /tmp/zhirox-v5116-exact tools/sign_v5116_exact.go

  sign-exact-candidate:
    name: Owner-only immutable artifact signature, NO ROLLOUT
    needs: [test-unsigned-proof-contract]
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      github.actor == 'arambarzani07' &&
      inputs.confirm == 'SIGN-ONLY-v5.1.16-6f3d4fa4'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - name: Compile pinned verification-only signer (WITHOUT secret)
        run: |
          set -euo pipefail
          go build -o "$RUNNER_TEMP/zhirox-v5116-exact" tools/sign_v5116_exact.go

      - name: Verify immutable GitHub Actions artifact ID, digest, source and successful run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh run view 45034007224 --repo arambarzani07/ZhiroxAi2026 --json conclusion,headSha \
            --jq 'if .conclusion == "success" and .headSha == "a3385ac359cabeb718c34d31755558789645e878" then "pass" else error("build provenance mismatch") end' | grep -qx pass
          gh api repos/arambarzani07/ZhiroxAi2026/actions/artifacts/14758579581 \
            --jq 'if .id == 14758579581 and .expired == false and .digest == "sha256:3511bb5d7da259d749f4f908f142ddff6530997ef8da9396695dd138830c6266" and .name == "Zhirox-PC-OS-v5.1.16-a3385ac359cabeb718c34d31755558789645e878" then "pass" else error("artifact identity mismatch") end' | grep -qx pass

      - name: Download artifact from the ORIGINAL verified Windows build only
        uses: actions/download-artifact@v4
        with:
          name: Zhirox-PC-OS-v5.1.16-a3385ac359cabeb718c34d31755558789645e878
          run-id: 45034007224
          repository: arambarzani07/ZhiroxAi2026
          github-token: ${{ github.token }}
          path: unsigned-candidate

      - name: Independently verify artifact, pinned SHA, bytes and UNSIGNED release gate
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          manifest=json.loads(Path('release-candidates/v5.1.16/manifest.json').read_text())
          binary=Path('unsigned-candidate/ZhiroxAISupervisor.exe')
          assert binary.is_file() and not binary.is_symlink(), 'candidate binary missing'
          raw=binary.read_bytes()
          h=hashlib.sha256(raw).hexdigest()
          assert len(raw)==20063232, 'candidate binary length mismatch'
          assert h=='6f3d4fa4e1537a24f79f60e927c19175b8efcc6ca2b2f9fe5eaa82e94b53b6ef', 'candidate hash mismatch'
          assert manifest['source_commit']=='a3385ac359cabeb718c34d31755558789645e878'
          assert manifest['workflow_run_id']==45034007224
          assert manifest['artifact_id']==14758579581
          assert manifest['artifact_zip_sha256']=='3511bb5d7da259d749f4f908f142ddff6530997ef8da9396695dd138830c6266'
          assert manifest['artifact_name']=='Zhirox-PC-OS-v5.1.16-a3385ac359cabeb718c34d31755558789645e878'
          assert manifest['sha256']==h and manifest['size_bytes']==len(raw)
          assert manifest['version']=='5.1.16'
          assert manifest['pinned_update_public_key_hex']=='19b97bd1183b741f2dce3a3b8495aba13d5b0d160504c69c92bdc37b0d941143'
          assert manifest['signature_b64'] is None and manifest['publishable'] is False and manifest['rollout_allowed'] is False
          print('PINNED_UNSIGNED_CANDIDATE_VERIFIED')
          PY

      - name: Sign canonical exact SHA / size with EXISTING Ed25519 key (no PFX)
        env:
          ZHIROX_UPDATE_ED25519_SEED_B64: ${{ secrets.ZHIROX_UPDATE_ED25519_SEED_B64 }}
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zhirox-v5116-exact" sign \
            unsigned-candidate/ZhiroxAISupervisor.exe \
            signed-proof/v5116-signature-proof.json

      - name: Verify public signature independently (NO secret)
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/zhirox-v5116-exact" verify \
            unsigned-candidate/ZhiroxAISupervisor.exe \
            signed-proof/v5116-signature-proof.json
          python3 - <<'PY'
          import json
          p=json.load(open('signed-proof/v5116-signature-proof.json'))
          assert p['publishable'] is False and p['rollout_allowed'] is False
          assert p['sha256']=='6f3d4fa4e1537a24f79f60e927c19175b8efcc6ca2b2f9fe5eaa82e94b53b6ef'
          assert p['public_key_hex']=='19b97bd1183b741f2dce3a3b8495aba13d5b0d160504c69c92bdc37b0d941143'
          print('SIGNATURE_VERIFIED_WITH_PRODUCTION_PIN; ROLLOUT_STILL_BLOCKED')
          PY

      - name: Upload ONLY public signature proof (never EXE, PFX, seed or service token)
        uses: actions/upload-artifact@v4
        with:
          name: Zhirox-v5.1.16-Ed25519-PUBLIC-PROOF-NO-ROLLOUT
          path: signed-proof/v5116-signature-proof.json
          if-no-files-found: error
          retention-days: 7
