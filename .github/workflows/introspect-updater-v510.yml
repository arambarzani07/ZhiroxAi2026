name: Audit legacy updater source archive

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pc-os-v510
    paths:
      - '.github/workflows/introspect-updater-v510.yml'

permissions:
  contents: read

jobs:
  updater-audit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Restore original source archive and record members
        run: |
          set -euo pipefail
          mkdir -p buildsrc audit
          cat source-v5.0.1.part001 source-v5.0.1.part002 source-v5.0.1.part003 | base64 -d > /tmp/zhirox-source.tar.gz
          tar -tzf /tmp/zhirox-source.tar.gz | sort > audit/archive-members.txt
          tar -xzf /tmp/zhirox-source.tar.gz -C buildsrc

      - name: Apply hardened lineage through v5.0.9
        run: |
          set -euo pipefail
          python3 tools/patch_downloader_v503.py
          python3 tools/patch_v505.py
          python3 tools/patch_v506.py
          python3 tools/patch_v507.py
          python3 tools/patch_v508.py
          python3 tools/patch_v509.py

      - name: Generate non-secret legacy updater evidence
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path('buildsrc')
          audit = Path('audit')
          patterns = re.compile(
              r'(?i)(ZhiroxUpdater|updater|rollback|health[-_ ]?marker|'
              r'--current|--new|--pid|--sha256|pre-vrollback|failed[-_ ]?update|'
              r'update-health\.json|\.new\b)'
          )
          archive_suffixes = ('.zip', '.tar', '.tgz', '.tar.gz', '.gz', '.7z')
          updater_named = []
          embedded_archives = []
          matches = []

          for p in sorted(root.rglob('*')):
              if not p.is_file():
                  continue
              rel = p.relative_to(root).as_posix()
              low = rel.lower()
              if 'updater' in low or 'update' in low:
                  updater_named.append(rel)
              if low.endswith(archive_suffixes):
                  embedded_archives.append(rel)
              try:
                  if p.stat().st_size > 2 * 1024 * 1024:
                      continue
                  raw = p.read_bytes()
                  if b'\x00' in raw[:8192]:
                      continue
                  text = raw.decode('utf-8', errors='ignore')
              except Exception:
                  continue
              for lineno, line in enumerate(text.splitlines(), 1):
                  if patterns.search(line):
                      safe = ' '.join(line.strip().split())[:500]
                      matches.append(f'{rel}:{lineno}: {safe}')

          report = [
              '# Legacy updater archive audit',
              '',
              'Scope: repository source archive plus hardened patch lineage through v5.0.9.',
              'No PC command was issued and no secret/config value was intentionally collected.',
              '',
              '## Updater/update-named files',
          ]
          report += [f'- {x}' for x in updater_named] or ['- none']
          report += ['', '## Embedded archives']
          report += [f'- {x}' for x in embedded_archives] or ['- none']
          report += ['', '## Updater/rollback textual markers']
          report += [f'- {x}' for x in matches] or ['- none']
          report += ['', '## Conclusion marker']
          has_updater_impl = any('updater' in x.lower() and not x.lower().endswith('main.go') for x in updater_named)
          has_rollback_marker = any(re.search(r'(?i)(rollback|pre-vrollback|failed[-_ ]?update)', x) for x in matches)
          report.append(f'- dedicated_updater_source_candidate={str(has_updater_impl).lower()}')
          report.append(f'- rollback_marker_found={str(has_rollback_marker).lower()}')
          audit.joinpath('legacy-updater-audit.md').write_text('\n'.join(report) + '\n')
          PY

      - name: List embedded ZIP members when present
        run: |
          set -euo pipefail
          : > audit/embedded-zip-members.txt
          while IFS= read -r -d '' f; do
            echo "## $f" >> audit/embedded-zip-members.txt
            unzip -l "$f" >> audit/embedded-zip-members.txt 2>&1 || true
            echo >> audit/embedded-zip-members.txt
          done < <(find buildsrc -type f -iname '*.zip' -print0)

      - name: Upload updater audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: legacy-updater-audit-${{ github.sha }}
          path: audit/
          if-no-files-found: error
          retention-days: 7
