name: Inspect Protection v5.0.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-protection-v506.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore patched v5.0.6 source
        run: |
          mkdir -p buildsrc
          cat source-v5.0.1.part001 source-v5.0.1.part002 source-v5.0.1.part003 | base64 -d > /tmp/zhirox-source.tar.gz
          tar -xzf /tmp/zhirox-source.tar.gz -C buildsrc
          python3 tools/patch_downloader_v503.py
          python3 tools/patch_v505.py
          python3 tools/patch_v506.py
          gofmt -w buildsrc/*.go
      - name: Inspect all mutating protection gates
        run: |
          echo '--- OWNER PATH ---'
          grep -Rni -A 80 -B 20 'func ownerPath' buildsrc || true
          echo '--- GUARD PROTECTED USAGES ---'
          grep -Rni -C 8 'guardProtected' buildsrc || true
          echo '--- PROCESS / APP / SERVICE MUTATIONS ---'
          grep -Rni -A 100 -B 15 'func processTerminate\|func restartApp\|func runApp\|func restartService\|func serviceControl\|func serviceStartTypeSet' buildsrc || true
          echo '--- OTHER PATH MUTATIONS ---'
          grep -Rni -A 80 -B 15 'func directoryCopy\|func archiveCreate\|func archiveExtract\|func msiInstall\|func msiUninstall\|func driverInstall\|func printerQueue' buildsrc || true
