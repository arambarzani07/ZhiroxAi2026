name: Trusted Controller v1 Safety

on:
  push:
    branches:
      - feature/trusted-controller-v1
    paths:
      - 'remote/agent-v1/trusted_controller_v1.go'
      - 'remote/agent-v1/trusted_controller_v1_test.go'
      - 'remote/agent-v1/trusted_controller_lifecycle_v1.go'
      - 'remote/agent-v1/trusted_controller_lifecycle_v1_test.go'
      - 'remote/agent-v1/trusted_controller_session_v1.go'
      - 'remote/agent-v1/trusted_controller_session_v1_test.go'
      - 'remote/agent-v1/trusted_controller_replay_v1.go'
      - 'remote/agent-v1/trusted_controller_replay_v1_test.go'
      - 'remote/agent-v1/trusted_controller_signaling_v1.go'
      - 'remote/agent-v1/trusted_controller_signaling_v1_test.go'
      - 'remote/agent-v1/trusted_controller_handshake_v1.go'
      - 'remote/agent-v1/trusted_controller_handshake_v1_test.go'
      - 'remote/agent-v1/signaling.go'
      - '.github/workflows/trusted-controller-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Run remote agent tests
        working-directory: remote/agent-v1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go mod tidy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- go.mod
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enforce trusted-controller safety boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $auth = Get-Content 'remote/agent-v1/trusted_controller_v1.go' -Raw
          $lifecycle = Get-Content 'remote/agent-v1/trusted_controller_lifecycle_v1.go' -Raw
          $session = Get-Content 'remote/agent-v1/trusted_controller_session_v1.go' -Raw
          $replay = Get-Content 'remote/agent-v1/trusted_controller_replay_v1.go' -Raw
          $trustedSignaling = Get-Content 'remote/agent-v1/trusted_controller_signaling_v1.go' -Raw
          $handshake = Get-Content 'remote/agent-v1/trusted_controller_handshake_v1.go' -Raw
          $wireSignaling = Get-Content 'remote/agent-v1/signaling.go' -Raw
          $combined = $auth + "`n" + $lifecycle + "`n" + $session + "`n" + $replay + "`n" + $trustedSignaling + "`n" + $handshake + "`n" + $wireSignaling
          if ($auth -notmatch 'ed25519.Verify') { throw 'cryptographic controller verification missing' }
          if ($auth -notmatch 'AgentID:\s+challenge.AgentID' -or $auth -notmatch 'SessionID:\s+challenge.SessionID') { throw 'challenge-to-session binding missing' }
          if ($auth -notmatch 'Revoked') { throw 'revocation gate missing' }
          if ($auth -notmatch 'TrustedChallengeTTL') { throw 'bounded challenge TTL missing' }
          if ($auth -notmatch 'TrustedSessionTTL') { throw 'bounded session authorization TTL missing' }
          if ($lifecycle -notmatch 'OwnerAuthorizationID') { throw 'explicit owner authorization reference missing' }
          if ($lifecycle -notmatch 'MarkTrustedControllerRevoked') { throw 'revocation persistence contract missing' }
          if ($lifecycle -notmatch 'AppendTrustedControllerAudit') { throw 'audit persistence contract missing' }
          if ($lifecycle -notmatch 'TrustedAuditEnrolled' -or $lifecycle -notmatch 'TrustedAuditRevoked') { throw 'enrollment/revocation audit events missing' }
          if ($session -notmatch 'TrustedSessionCapabilityRequest') { throw 'explicit requested capability contract missing' }
          if ($session -notmatch 'requested.Mouse && !auth.Mouse' -or $session -notmatch 'requested.Keyboard && !auth.Keyboard') { throw 'capability escalation guard missing' }
          if ($replay -notmatch 'TrustedChallengeReplayGuard' -or $replay -notmatch 'ConsumeTrustedChallenge') { throw 'atomic replay-consumption contract missing' }
          if ($replay -notmatch 'VerifyTrustedControllerOnce') { throw 'one-time trusted verification entry point missing' }
          if ($wireSignaling -notmatch 'ControllerID' -or $wireSignaling -notmatch 'controller_id') { throw 'controller identity missing from signaling contract' }
          if ($trustedSignaling -notmatch 'ParseRemoteCapabilitiesV2') { throw 'strict signaling capability parser missing' }
          if ($trustedSignaling -notmatch 'grant.ControllerID != intent.ControllerID' -or $trustedSignaling -notmatch 'grant.SessionID != intent.SessionID') { throw 'trusted signaling identity binding missing' }
          if ($trustedSignaling -notmatch 'grant.Screen != intent.Requested.Screen' -or $trustedSignaling -notmatch 'grant.Mouse != intent.Requested.Mouse' -or $trustedSignaling -notmatch 'grant.Keyboard != intent.Requested.Keyboard') { throw 'trusted signaling exact capability binding missing' }
          if ($handshake -notmatch 'StartTrustedControllerHandshake' -or $handshake -notmatch 'CompleteTrustedControllerHandshake') { throw 'trusted signaling handshake entry points missing' }
          if ($handshake -notmatch 'trustedHandshakeIntentHash' -or $handshake -notmatch 'intentHash') { throw 'sealed pending signaling intent missing' }
          if ($handshake -notmatch 'VerifyTrustedControllerOnce' -or $handshake -notmatch 'GrantTrustedSession' -or $handshake -notmatch 'BindTrustedGrantToSignaling') { throw 'trusted handshake verification/grant/binding chain missing' }
          if ($combined -match 'SendInput|mouse_event|keybd_event|CreateRemoteThread|PowerShell|cmd.exe') {
            throw 'OS input execution or arbitrary command execution is forbidden in auth groundwork'
          }
