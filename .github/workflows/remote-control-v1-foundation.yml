name: Remote Control v1 Foundation

on:
  push:
    branches:
      - feature/full-remote-control-v1
    paths:
      - '.github/workflows/remote-control-v1-foundation.yml'
      - 'src/pc_os_remote_control_v1.go'
      - 'src/pc_os_remote_control_v1_test.go'
      - 'src/pc_os_remote_input_v1.go'
      - 'src/pc_os_remote_input_v1_test.go'
      - 'remote/agent-v1/**'
      - 'remote/controller-v1/**'
      - 'ops/supabase/remote_control_v1_schema.sql'
      - 'ops/supabase/zhirox-pc-remote-signaling-v1.ts'
      - 'docs/REMOTE_CONTROL_V1.md'
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  remote-control-v1-foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Go policy and protocol tests
        run: |
          set -euo pipefail
          go test src/pc_os_remote_control_v1.go src/pc_os_remote_control_v1_test.go src/pc_os_remote_input_v1.go src/pc_os_remote_input_v1_test.go

      - name: Pion WebRTC transport tests
        working-directory: remote/agent-v1
        run: |
          set -euo pipefail
          go mod tidy
          go test ./...
          go vet ./...
          git diff --exit-code -- go.mod

      - name: Signaling and browser-controller checks
        run: |
          set -euo pipefail
          deno check ops/supabase/zhirox-pc-remote-signaling-v1.ts
          node --check remote/controller-v1/app.js
          grep -q 'video/h264' remote/controller-v1/app.js
          grep -q 'waiting for local approval' remote/controller-v1/app.js
          if grep -Eqi 'localStorage|sessionStorage' remote/controller-v1/app.js; then
            echo 'Controller v1 must not persist credentials.' >&2
            exit 1
          fi
          if grep -Eqi 'keydown|keyup|mousemove|mousedown|mouseup|wheel' remote/controller-v1/app.js; then
            echo 'Controller v1 must not register or send input events.' >&2
            exit 1
          fi

      - name: Fail-closed invariants
        run: |
          set -euo pipefail
          grep -q 'Enabled:[[:space:]]*false' src/pc_os_remote_control_v1.go
          grep -q 'AttendedApprovalRequired:[[:space:]]*true' src/pc_os_remote_control_v1.go
          grep -q 'UnattendedAccessEnabled:[[:space:]]*false' src/pc_os_remote_control_v1.go
          grep -q 'SecureDesktopControl:[[:space:]]*false' src/pc_os_remote_control_v1.go
          grep -q 'SignalingCarriesMedia:[[:space:]]*false' src/pc_os_remote_control_v1.go
          grep -q 'WebRTCDTLSEncryption:[[:space:]]*true' src/pc_os_remote_control_v1.go
          grep -q 'Mouse:[[:space:]]*false' src/pc_os_remote_control_v1.go
          grep -q 'Keyboard:[[:space:]]*false' src/pc_os_remote_control_v1.go
          grep -q 'Clipboard:[[:space:]]*false' src/pc_os_remote_control_v1.go
          grep -q 'FileTransfer:[[:space:]]*false' src/pc_os_remote_control_v1.go
          grep -q 'pcOSRemoteInputRuntimeEnabled = false' src/pc_os_remote_input_v1.go
          grep -q 'input_control_enabled:[[:space:]]*false' ops/supabase/zhirox-pc-remote-signaling-v1.ts
          grep -q 'media_proxy:[[:space:]]*false' ops/supabase/zhirox-pc-remote-signaling-v1.ts
          grep -q '^go 1.24' remote/agent-v1/go.mod
          grep -q 'github.com/pion/webrtc/v4 v4.2.23' remote/agent-v1/go.mod
          grep -q 'webrtc.MimeTypeH264' remote/agent-v1/session.go
          grep -q 'packetization-mode=1' remote/agent-v1/session.go
          if grep -Eqi 'cmd\.exe|powershell\.exe|SendInput|mouse_event|keybd_event|OpenClipboard|SetClipboardData' src/pc_os_remote_control_v1.go src/pc_os_remote_input_v1.go remote/agent-v1/session.go ops/supabase/zhirox-pc-remote-signaling-v1.ts; then
            echo 'Phase 1/2 foundation must not contain input injection or shell execution.' >&2
            exit 1
          fi

      - name: Schema safety checks
        run: |
          set -euo pipefail
          grep -q 'enable row level security' ops/supabase/remote_control_v1_schema.sql
          grep -q 'revoke all on public.pc_remote_sessions from anon, authenticated' ops/supabase/remote_control_v1_schema.sql
          grep -q "state in ('requested','approved','connecting','active','ended','rejected','expired')" ops/supabase/remote_control_v1_schema.sql
          grep -q "expires_at <= requested_at + interval '30 minutes'" ops/supabase/remote_control_v1_schema.sql
