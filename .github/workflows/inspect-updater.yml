name: Inspect Zhirox updater source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-updater.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source bundle
        run: |
          mkdir -p buildsrc diagnostics
          cat source-v5.0.1.part001 source-v5.0.1.part002 source-v5.0.1.part003 | base64 -d > /tmp/zhirox-source.tar.gz
          tar -xzf /tmp/zhirox-source.tar.gz -C buildsrc
      - name: Capture focused updater source
        run: |
          {
            echo '=== update context ==='
            nl -ba buildsrc/main.go | sed -n '1788,1938p'
            echo '=== cleanup context ==='
            nl -ba buildsrc/main.go | sed -n '1938,2035p'
            echo '=== heartbeat and main context ==='
            nl -ba buildsrc/main.go | sed -n '1645,1690p'
            nl -ba buildsrc/main.go | sed -n '2030,2095p'
          } > diagnostics/updater-focused.txt
      - name: Publish inspection text
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/updater-focused.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Capture update cleanup and health source [skip ci]'
            git push
          fi
