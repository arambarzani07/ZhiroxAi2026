name: Build trusted Zhirox update

on:
  push:
    branches: [main]
    paths:
      - 'source-v5.0.1.part*'
      - '.github/workflows/build-update.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
      - name: Restore source bundle
        run: |
          mkdir -p buildsrc channel
          cat source-v5.0.1.part001 source-v5.0.1.part002 source-v5.0.1.part003 | base64 -d > /tmp/zhirox-source.tar.gz
          tar -xzf /tmp/zhirox-source.tar.gz -C buildsrc
      - name: Harden updater downloader and bump version
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          project_host = 'vllwundrtrgdqmkqbduy.supabase.co'
          patched = False

          for p in sorted(Path('buildsrc').glob('*.go')):
              text = p.read_text()
              marker = 'func downloadWithAgentAuth('
              start = text.find(marker)
              if start < 0:
                  continue

              brace = text.find('{', start)
              if brace < 0:
                  raise SystemExit(f'Cannot find function body in {p}')

              depth = 0
              end = None
              in_string = False
              escape = False
              for i in range(brace, len(text)):
                  ch = text[i]
                  if in_string:
                      if escape:
                          escape = False
                      elif ch == '\\':
                          escape = True
                      elif ch == '"':
                          in_string = False
                      continue
                  if ch == '"':
                      in_string = True
                      continue
                  if ch == '{':
                      depth += 1
                  elif ch == '}':
                      depth -= 1
                      if depth == 0:
                          end = i + 1
                          break
              if end is None:
                  raise SystemExit(f'Cannot determine function end in {p}')

              fn = text[start:end]
              req_match = re.search(r'(?m)^\s*([A-Za-z_]\w*)\s*,\s*err\s*:=\s*http\.NewRequest(?:WithContext)?\s*\(', fn)
              if not req_match:
                  req_match = re.search(r'(?m)^\s*([A-Za-z_]\w*)\s*,\s*[^:=\n]+\s*:=\s*http\.NewRequest(?:WithContext)?\s*\(', fn)
              if not req_match:
                  raise SystemExit(f'Cannot identify HTTP request variable in {p}')
              reqvar = req_match.group(1)

              do_match = re.search(r'(?m)^(\s*)resp\s*,\s*err\s*:=\s*([A-Za-z_]\w*)\.Do\(\s*'+re.escape(reqvar)+r'\s*\)', fn)
              if not do_match:
                  raise SystemExit(f'Cannot identify HTTP client.Do call in {p}')
              indent, clientvar = do_match.group(1), do_match.group(2)

              # Never send the agent bearer secret to a non-Supabase download host.
              auth_guard = (
                  f'{indent}if {reqvar}.URL == nil || {reqvar}.URL.Hostname() != "{project_host}" {{\n'
                  f'{indent}\t{reqvar}.Header.Del("Authorization")\n'
                  f'{indent}}}\n'
              )
              if f'{reqvar}.Header.Del("Authorization")' not in fn:
                  pos = do_match.start()
                  fn = fn[:pos] + auth_guard + fn[pos:]

              # Slow/unstable WAN links should not fail after only 25 seconds.
              fn = re.sub(r'25\s*\*\s*time\.Second', '120 * time.Second', fn)

              # Retry transient network errors up to 3 times, still background-only.
              fn = re.sub(
                  r'(?m)^(\s*)resp\s*,\s*err\s*:=\s*'+re.escape(clientvar)+r'\.Do\(\s*'+re.escape(reqvar)+r'\s*\)',
                  r'\1resp, err := zhiroxDoWithRetry('+clientvar+', '+reqvar+', 3)',
                  fn,
                  count=1,
              )

              text = text[:start] + fn + text[end:]

              if 'func zhiroxDoWithRetry(' not in text:
                  text += '''\n\n// zhiroxDoWithRetry retries transient transport errors without showing UI.\nfunc zhiroxDoWithRetry(client *http.Client, req *http.Request, attempts int) (*http.Response, error) {\n\tif attempts < 1 {\n\t\tattempts = 1\n\t}\n\tvar resp *http.Response\n\tvar err error\n\tfor i := 0; i < attempts; i++ {\n\t\trequest := req\n\t\tif i > 0 {\n\t\t\trequest = req.Clone(req.Context())\n\t\t}\n\t\tresp, err = client.Do(request)\n\t\tif err == nil {\n\t\t\treturn resp, nil\n\t\t}\n\t\tif i+1 < attempts {\n\t\t\ttime.Sleep(time.Duration(i+1) * 2 * time.Second)\n\t\t}\n\t}\n\treturn resp, err\n}\n'''

              # Keep the running agent version aligned with the published channel version.
              text = text.replace('5.0.1', '5.0.2')
              p.write_text(text)
              patched = True
              print(f'Patched updater in {p}')
              break

          if not patched:
              raise SystemExit('downloadWithAgentAuth not found; refusing to publish an unpatched build')
          PY
          gofmt -w buildsrc/*.go
      - name: Build Windows background supervisor
        working-directory: buildsrc
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags='-H=windowsgui -s -w' -o ../channel/ZhiroxAISupervisor.exe main.go admin_actions_v48.go owner_actions.go hash_v48.go
      - name: Generate trusted channel metadata
        run: |
          SHA=$(sha256sum channel/ZhiroxAISupervisor.exe | awk '{print $1}')
          SIZE=$(stat -c%s channel/ZhiroxAISupervisor.exe)
          printf '{"version":"5.0.2","file":"ZhiroxAISupervisor.exe","sha256":"%s","size":%s,"notes":"Secure host-scoped updater auth; 120s timeout; 3-attempt transient retry; Zero-UI preserved"}\n' "$SHA" "$SIZE" > channel/metadata.json
          sha256sum channel/ZhiroxAISupervisor.exe > channel/ZhiroxAISupervisor.exe.sha256
      - name: Publish channel artifacts
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add channel/ZhiroxAISupervisor.exe channel/ZhiroxAISupervisor.exe.sha256 channel/metadata.json
          if ! git diff --cached --quiet; then
            git commit -m 'Publish Zhirox v5.0.2 trusted update [skip ci]'
            git push
          fi
