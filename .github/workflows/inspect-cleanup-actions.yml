name: Inspect Cleanup Actions

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/inspect-cleanup-actions.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore current source
        run: |
          mkdir -p buildsrc
          cat source-v5.0.1.part001 source-v5.0.1.part002 source-v5.0.1.part003 | base64 -d > /tmp/zhirox-source.tar.gz
          tar -xzf /tmp/zhirox-source.tar.gz -C buildsrc
          python3 tools/patch_downloader_v503.py
          python3 tools/patch_v505.py
          python3 tools/patch_v506.py
          python3 tools/patch_v507.py
      - name: Inspect approval contract
        run: |
          grep -Rni -E -A 50 -B 20 'func ownerApproved|func requireOwnerApproval|explicit approval required|owner_approved|approved' buildsrc/owner_actions.go buildsrc/main.go || true
