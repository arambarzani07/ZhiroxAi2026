name: Build Zhirox PC OS v5.1.1

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/v511-secure-key-rotation
    paths:
      - '.github/workflows/build-v511.yml'
      - 'release-gates/v5.1.1-next-public-key.hex'
      - 'release-gates/v5.1.1-transition-signature.b64'
      - 'src/**'
      - 'tools/**'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'

      - name: Unit tests
        run: |
          set -euo pipefail
          go test src/pc_os_v510.go src/pc_os_cloud_v510.go src/pc_os_update_enforce_v510.go src/update_trust_v510.go src/pc_os_backup_policy_v510.go src/pc_os_v510_test.go src/pc_os_update_enforce_v510_test.go src/pc_os_backup_policy_v510_test.go

      - name: Restore and harden source
        run: |
          set -euo pipefail
          mkdir -p buildsrc channel
          cat source-v5.0.1.part001 source-v5.0.1.part002 source-v5.0.1.part003 | base64 -d > /tmp/zhirox-source.tar.gz
          tar -xzf /tmp/zhirox-source.tar.gz -C buildsrc
          python3 tools/patch_downloader_v503.py
          python3 tools/patch_v505.py
          python3 tools/patch_v506.py
          python3 tools/patch_v507.py
          python3 tools/patch_v508.py
          python3 tools/patch_v509.py
          cp src/pc_os_v510.go buildsrc/pc_os_v510.go
          cp src/pc_os_cloud_v510.go buildsrc/pc_os_cloud_v510.go
          cp src/pc_os_windows_v510.go buildsrc/pc_os_windows_v510.go
          cp src/pc_os_backup_policy_v510.go buildsrc/pc_os_backup_policy_v510.go
          cp src/pc_os_backup_v510_windows.go buildsrc/pc_os_backup_v510_windows.go
          cp src/pc_os_update_enforce_v510.go buildsrc/pc_os_update_enforce_v510.go
          cp src/pc_os_self_updater_v510_windows.go buildsrc/pc_os_self_updater_v510_windows.go
          cp src/update_trust_v510.go buildsrc/update_trust_v510.go
          python3 tools/patch_v510.py
          python3 tools/patch_trust_v510.py
          python3 tools/patch_self_updater_v510.py
          cp src/pc_os_recovery_v511_windows.go buildsrc/pc_os_recovery_v511_windows.go
          python3 tools/patch_v511.py
          gofmt -w buildsrc/*.go

      - name: Prepare production trust markers without private keys
        if: github.ref == 'refs/heads/main'
        env:
          OLD_PUBLIC_KEY: 3cdf94418d5a43734c49238268ed7512481c97faa691a0cd053eb9f74fbe10bd
        run: |
          set -euo pipefail
          test -s release-gates/v5.1.1-next-public-key.hex
          NEXT="$(tr -d '[:space:]' < release-gates/v5.1.1-next-public-key.hex | tr 'A-F' 'a-f')"
          [[ "$NEXT" =~ ^[0-9a-f]{64}$ ]]
          test "$NEXT" != "$OLD_PUBLIC_KEY"
          printf 'package main\n\nconst pcOSPinnedUpdatePublicKeyHex = "%s"\n' "$NEXT" > buildsrc/update_trust_v510.go
          printf '%s\n' "$NEXT" > channel/update-public-key.hex
          printf '%s\n' "$OLD_PUBLIC_KEY" > channel/transition-signing-public-key.hex
          gofmt -w buildsrc/update_trust_v510.go

      - name: Safety and Zero-UI invariants
        run: |
          set -euo pipefail
          grep -q '5.1.1' buildsrc/main.go
          grep -q 'const pcOSVersion = "5.1.1"' buildsrc/pc_os_v510.go
          grep -q 'pc_os_core_recovery_status' buildsrc/main.go
          grep -q 'pc_os_core_recovery_set' buildsrc/main.go
          grep -q 'generic Zhirox Core restart is locked' buildsrc/main.go
          grep -Eq '"zhiroxaicore"[[:space:]]*:[[:space:]]*true' buildsrc/owner_actions.go
          grep -q 'ChangeServiceConfig2W' buildsrc/pc_os_recovery_v511_windows.go
          grep -q 'ENABLE_ZHIROX_CORE_SELF_HEALING' buildsrc/pc_os_recovery_v511_windows.go
          grep -q 'FailureActionsOnNonCrashFailures: 1' buildsrc/pc_os_recovery_v511_windows.go
          if grep -Eqi 'cmd\.exe|powershell\.exe|exec\.Command\(' buildsrc/pc_os_recovery_v511_windows.go; then
            echo 'Zero-UI invariant failed.' >&2
            exit 1
          fi

      - name: Windows compile check
        working-directory: buildsrc
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          set -euo pipefail
          go vet ./...
          go build -trimpath -ldflags='-H=windowsgui -s -w' -o ../channel/ZhiroxAISupervisor.exe main.go admin_actions_v48.go owner_actions.go hash_v48.go pc_os_v510.go pc_os_cloud_v510.go pc_os_windows_v510.go pc_os_backup_policy_v510.go pc_os_backup_v510_windows.go pc_os_update_enforce_v510.go pc_os_self_updater_v510_windows.go pc_os_recovery_v511_windows.go update_trust_v510.go

      - name: Ephemeral two-key preflight on feature branch
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          TMP=$(mktemp -d)
          trap 'rm -rf "$TMP"' EXIT
          cp -a buildsrc "$TMP/buildsrc"
          mkdir -p "$TMP/channel"
          export ZHIROX_V510_TRANSITION_ED25519_SEED_B64=$(head -c 32 /dev/urandom | base64 -w0)
          export ZHIROX_V511_NEXT_ED25519_SEED_B64=$(head -c 32 /dev/urandom | base64 -w0)
          (
            cd "$TMP"
            go run "$GITHUB_WORKSPACE/tools/prepare_transition_trust_v511.go"
            gofmt -w buildsrc/update_trust_v510.go
          )
          (
            cd "$TMP/buildsrc"
            GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-H=windowsgui -s -w' -o ../channel/ZhiroxAISupervisor.exe main.go admin_actions_v48.go owner_actions.go hash_v48.go pc_os_v510.go pc_os_cloud_v510.go pc_os_windows_v510.go pc_os_backup_policy_v510.go pc_os_backup_v510_windows.go pc_os_update_enforce_v510.go pc_os_self_updater_v510_windows.go pc_os_recovery_v511_windows.go update_trust_v510.go
          )
          (
            cd "$TMP"
            go run "$GITHUB_WORKSPACE/tools/sign_metadata_v511.go"
            go run "$GITHUB_WORKSPACE/tools/verify_metadata_v511.go"
          )

      - name: Feature build metadata
        if: github.ref != 'refs/heads/main'
        run: |
          set -euo pipefail
          SHA=$(sha256sum channel/ZhiroxAISupervisor.exe | awk '{print $1}')
          SIZE=$(stat -c%s channel/ZhiroxAISupervisor.exe)
          printf '{"version":"5.1.1","file":"ZhiroxAISupervisor.exe","sha256":"%s","size":%s,"publishable":false}\n' "$SHA" "$SIZE" > channel/metadata.json
          sha256sum channel/ZhiroxAISupervisor.exe > channel/ZhiroxAISupervisor.exe.sha256

      - name: Create or verify production signing request
        if: github.ref == 'refs/heads/main'
        env:
          ZHIROX_V510_ACCEPTED_PUBLIC_KEY_HEX: 3cdf94418d5a43734c49238268ed7512481c97faa691a0cd053eb9f74fbe10bd
        run: |
          set -euo pipefail
          SIG_FILE='release-gates/v5.1.1-transition-signature.b64'
          if [ -s "$SIG_FILE" ]; then
            export ZHIROX_V510_TRANSITION_SIGNATURE_B64="$(tr -d '[:space:]' < "$SIG_FILE")"
            go run tools/sign_metadata_v511.go
            go run tools/verify_metadata_v511.go
            echo 'SERVER_SIDE_SIGNATURE_VERIFIED=true'
          else
            export ZHIROX_V511_UNSIGNED_REQUEST=1
            go run tools/sign_metadata_v511.go
            echo '--- SERVER-SIDE SIGNING REQUEST ---'
            cat channel/signing-request.json
            echo '--- END SIGNING REQUEST ---'
          fi

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: Zhirox-PC-OS-v5.1.1-${{ github.sha }}
          path: channel/*
          if-no-files-found: error
