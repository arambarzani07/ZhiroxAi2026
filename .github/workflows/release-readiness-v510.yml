name: Check Zhirox v5.1 release readiness

on:
  workflow_dispatch:
  push:
    branches:
      - feature/pc-os-v510
      - main
    paths:
      - '.github/workflows/release-readiness-v510.yml'
      - '.github/workflows/build-v510.yml'
      - '.github/workflows/windows-updater-test-v510.yml'
      - 'release-gates/v5.1.0.json'
      - 'ops/supabase/zhirox-pc-relay-v15.ts'

permissions:
  contents: read

jobs:
  release-readiness:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      ZHIROX_UPDATE_ED25519_SEED_B64: ${{ secrets.ZHIROX_UPDATE_ED25519_SEED_B64 }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate non-secret release gate record
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          gate=json.loads(Path('release-gates/v5.1.0.json').read_text())
          assert gate['version']=='5.1.0'
          assert gate['production_expected_agent_version']=='5.0.8'
          assert gate['production_expected_channel_version']=='5.0.8'
          if gate.get('bootstrap_rollback_proven') is not True:
              raise SystemExit('RELEASE_READINESS=BLOCKED: 5.0.8 -> 5.1.0 bootstrap rollback is not proven')
          evidence=gate.get('bootstrap_rollback_evidence') or []
          if not evidence:
              raise SystemExit('RELEASE_READINESS=BLOCKED: bootstrap rollback evidence is missing')
          PY

      - name: Validate signing secret shape without disclosure
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, os
          value=os.environ.get('ZHIROX_UPDATE_ED25519_SEED_B64','').strip()
          if not value:
              raise SystemExit('RELEASE_READINESS=BLOCKED: signing secret is missing')
          try:
              raw=base64.b64decode(value, validate=True)
          except Exception:
              raise SystemExit('RELEASE_READINESS=BLOCKED: signing secret is not strict base64')
          if len(raw)!=32:
              raise SystemExit('RELEASE_READINESS=BLOCKED: decoded Ed25519 seed must be exactly 32 bytes')
          print('SIGNING_SECRET_SHAPE=VALID')
          PY

      - name: Require protected main with status checks
        run: |
          set -euo pipefail
          PROTECTED=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.protected')
          if [ "$PROTECTED" != "true" ]; then
            echo 'RELEASE_READINESS=BLOCKED: main branch is not protected' >&2
            exit 1
          fi
          ENFORCEMENT=$(gh api "repos/${GITHUB_REPOSITORY}/branches/main" --jq '.protection.required_status_checks.enforcement_level // "off"')
          if [ "$ENFORCEMENT" = "off" ]; then
            echo 'RELEASE_READINESS=BLOCKED: required status checks are not enforced on main' >&2
            exit 1
          fi

      - name: Require production channel to remain pinned during readiness
        run: |
          set -euo pipefail
          grep -q 'version:"5.0.8"' ops/supabase/zhirox-pc-relay-v15.ts
          if grep -q 'production_promoted":true' release-gates/v5.1.0.json; then
            echo 'RELEASE_READINESS=BLOCKED: production promotion must be a separate explicit cutover' >&2
            exit 1
          fi
          echo 'PRODUCTION_CHANNEL_PIN=5.0.8'

      - name: Mark readiness check passed
        run: echo 'RELEASE_READINESS=READY'
