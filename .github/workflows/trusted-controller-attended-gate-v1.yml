name: Trusted Controller Attended Gate v1

on:
  push:
    branches:
      - feature/trusted-controller-v1
    paths:
      - 'remote/agent-v1/trusted_controller_attended_gate_v1.go'
      - 'remote/agent-v1/trusted_controller_attended_gate_v1_test.go'
      - 'remote/agent-v1/attended_input_orchestrator_v1.go'
      - 'remote/agent-v1/attended_input_orchestrator_v1_test.go'
      - 'remote/agent-v1/attended_control_message_gate_v1.go'
      - 'remote/agent-v1/attended_control_message_gate_v1_test.go'
      - 'remote/agent-v1/attended_control_runtime_v1.go'
      - 'remote/agent-v1/attended_control_runtime_v1_test.go'
      - 'remote/agent-v1/attended_activation_readiness_v1.go'
      - 'remote/agent-v1/attended_activation_readiness_v1_test.go'
      - 'remote/agent-v1/attended_agent_session_v1.go'
      - 'remote/agent-v1/attended_agent_session_v1_test.go'
      - 'remote/agent-v1/attended_session_orchestrator_v1.go'
      - 'remote/agent-v1/attended_session_orchestrator_v1_test.go'
      - 'remote/agent-v1/consent_input_windows.go'
      - 'remote/agent-v1/session.go'
      - 'remote/agent-v1/session_control_gate_v2_test.go'
      - 'remote/agent-v1/trusted_controller_permit_v1.go'
      - 'remote/agent-v1/trusted_controller_permit_v1_test.go'
      - 'remote/agent-v1/trusted_controller_arbiter_v1.go'
      - 'remote/agent-v1/orchestrator.go'
      - 'remote/consent-v1/capabilities_v2.go'
      - 'remote/consent-v1/capabilities_v2_test.go'
      - 'remote/consent-v1/main_windows.go'
      - '.github/workflows/trusted-controller-attended-gate-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Run remote agent tests
        working-directory: remote/agent-v1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go mod tidy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- go.mod
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run consent helper tests
        working-directory: remote/consent-v1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enforce attended approval integration boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $gate = Get-Content 'remote/agent-v1/trusted_controller_attended_gate_v1.go' -Raw
          $integration = Get-Content 'remote/agent-v1/attended_input_orchestrator_v1.go' -Raw
          $messageGate = Get-Content 'remote/agent-v1/attended_control_message_gate_v1.go' -Raw
          $runtime = Get-Content 'remote/agent-v1/attended_control_runtime_v1.go' -Raw
          $readiness = Get-Content 'remote/agent-v1/attended_activation_readiness_v1.go' -Raw
          $binding = Get-Content 'remote/agent-v1/attended_agent_session_v1.go' -Raw
          $fullOrchestrator = Get-Content 'remote/agent-v1/attended_session_orchestrator_v1.go' -Raw
          $launcher = Get-Content 'remote/agent-v1/consent_input_windows.go' -Raw
          $session = Get-Content 'remote/agent-v1/session.go' -Raw
          $permit = Get-Content 'remote/agent-v1/trusted_controller_permit_v1.go' -Raw
          $legacyOrchestrator = Get-Content 'remote/agent-v1/orchestrator.go' -Raw
          $consentCaps = Get-Content 'remote/consent-v1/capabilities_v2.go' -Raw
          $consentMain = Get-Content 'remote/consent-v1/main_windows.go' -Raw
          $combined = $gate + "`n" + $integration + "`n" + $messageGate + "`n" + $runtime + "`n" + $readiness + "`n" + $binding + "`n" + $fullOrchestrator + "`n" + $launcher + "`n" + $session + "`n" + $permit + "`n" + $legacyOrchestrator + "`n" + $consentCaps + "`n" + $consentMain
          if ($gate -notmatch 'InteractiveUser') { throw 'interactive local approval marker missing' }
          if ($gate -notmatch 'explicit interactive local approval is required') { throw 'explicit local approval fail-closed check missing' }
          if ($gate -notmatch 'LocalInputApprovalTTL') { throw 'bounded local approval TTL missing' }
          if ($gate -notmatch 'NewLocalInputApproval') { throw 'bound local approval proof constructor missing' }
          if ($gate -notmatch 'permit.Validate\(arbiter, now\)') { throw 'continuous trusted permit validation missing' }
          if ($gate -notmatch 'approval.ControllerID != permit.ControllerID' -or $gate -notmatch 'approval.SessionID != permit.SessionID') { throw 'local approval identity binding missing' }
          if ($gate -notmatch 'permit.Mouse && !approval.Mouse' -or $gate -notmatch 'permit.Keyboard && !approval.Keyboard') { throw 'local approval exact capability binding missing' }
          if ($integration -notmatch 'RemoteInputConsent' -or $integration -notmatch 'ApproveInput') { throw 'interactive input-consent orchestration boundary missing' }
          if ($integration -notmatch 'NewLocalInputApproval' -or $integration -notmatch 'AuthorizeAttendedControl') { throw 'consent result is not bound into attended authorization' }
          if ($integration -notmatch 'StartAttendedInputIndicator' -or $integration -notmatch 'Authorization.Validate') { throw 'visible input indicator revalidation boundary missing' }
          if ($messageGate -notmatch 'ControlMessageGate' -or $messageGate -notmatch 'ValidateControlMessage') { throw 'per-message attended authorization gate missing' }
          if ($messageGate -notmatch 'Authorization.Validate') { throw 'per-message gate must revalidate attended authorization' }
          if ($runtime -notmatch 'PrepareAttendedControlRuntime') { throw 'attended runtime preparation boundary missing' }
          if ($runtime -notmatch 'StartAttendedInputIndicator') { throw 'attended runtime must require visible indicator before readiness' }
          if ($runtime -notmatch 'gate.ValidateControlMessage') { throw 'attended runtime must revalidate the per-message gate before readiness' }
          if ($runtime -notmatch 'active\s+bool' -or $runtime -notmatch 'isActive\(\)') { throw 'attended runtime liveness state missing' }
          if ($runtime -notmatch 'Dispatcher.Deactivate|dispatcher.Deactivate') { throw 'attended runtime must fail closed the dispatcher during prepare and teardown' }
          if ($readiness -notmatch 'PrepareAttendedActivationReadiness') { throw 'non-executing activation readiness boundary missing' }
          if ($readiness -notmatch 'AttendedActivationReadinessTTL') { throw 'short-lived activation readiness TTL missing' }
          if ($readiness -notmatch 'runtime.isActive\(\)') { throw 'activation readiness must require live visible runtime' }
          if ($readiness -notmatch 'gate.ValidateControlMessage') { throw 'activation readiness must revalidate attended authorization gate' }
          if ($readiness -notmatch 'dispatcher.Deactivate') { throw 'activation readiness validation must fail closed dispatcher on authorization failure' }
          if ($readiness -notmatch 'ReadinessID' -or $readiness -notmatch 'crypto/rand') { throw 'cryptographically unique activation readiness identity missing' }
          if ($readiness -notmatch 'NewAttendedActivationConsumer' -or $readiness -notmatch 'Consume\(') { throw 'one-time activation readiness consumer missing' }
          if ($readiness -notmatch 'already been consumed') { throw 'activation readiness replay rejection missing' }
          if ($readiness -notmatch 'AttendedActivationGrant' -or $readiness -notmatch 'ConsumedAt') { throw 'non-executing consumed activation grant missing' }
          if ($binding -notmatch 'NewAttendedAgentSession') { throw 'attended runtime to WebRTC session binding missing' }
          if ($binding -notmatch 'cfg.Runtime.ControlGate\(\)') { throw 'attended session must inherit runtime-owned per-message gate' }
          if ($binding -notmatch 'cfg.Session.Control = cfg.Runtime.dispatcher') { throw 'attended session must inherit runtime-owned dispatcher' }
          if ($binding -notmatch 'session control dispatcher must match attended runtime dispatcher') { throw 'foreign dispatcher substitution rejection missing' }
          if ($binding -notmatch 'session control gate is owned by attended runtime') { throw 'caller-supplied gate substitution rejection missing' }
          if ($fullOrchestrator -notmatch 'PrepareAttendedAgentSession') { throw 'full attended session orchestration boundary missing' }
          if ($fullOrchestrator -notmatch 'RequestAttendedInputAuthorization') { throw 'full attended path must begin with explicit local authorization' }
          if ($fullOrchestrator -notmatch 'PrepareAttendedControlRuntime') { throw 'full attended path must prepare visible fail-closed runtime' }
          if ($fullOrchestrator -notmatch 'NewAttendedAgentSession') { throw 'full attended path must bind prepared runtime to WebRTC session' }
          if ($fullOrchestrator -notmatch 'Dispatcher.Deactivate|dispatcher.Deactivate') { throw 'full attended path must explicitly fail closed dispatcher on errors' }
          if ($session -notmatch 'ControlGate\s+ControlMessageGate') { throw 'session control gate contract missing' }
          if ($session -notmatch 'control dispatcher requires attended authorization gate') { throw 'session must fail closed when dispatcher has no attended gate' }
          if ($session -notmatch 'cfg.ControlGate.ValidateControlMessage') { throw 'DataChannel must revalidate attended authorization before dispatch' }
          if ($session -notmatch 'cfg.Control.Dispatch') { throw 'abstract dispatcher route missing' }
          if ($launcher -notmatch '--capability-mode=' -or $launcher -notmatch 'ApproveInput' -or $launcher -notmatch 'StartInputIndicator') { throw 'Windows consent launcher exact capability mode missing' }
          if ($consentMain -notmatch 'parseConsentCapabilityMode\(argValue\("--capability-mode="\)\)') { throw 'consent helper does not parse capability mode' }
          if ($consentCaps -notmatch 'screen-mouse' -or $consentCaps -notmatch 'screen-keyboard' -or $consentCaps -notmatch 'screen-input') { throw 'exact input disclosure modes missing' }
          if ($legacyOrchestrator -notmatch 'screenOnlyCapabilities\(request.RequestedCapabilities\)') { throw 'existing live orchestrator must remain screen-only' }
          if ($combined -match '\.Activate\(') { throw 'attended integration must not activate dispatcher' }
          if ($combined -match 'SendInput|mouse_event|keybd_event|CreateRemoteThread|PowerShell|cmd.exe') {
            throw 'OS input execution or arbitrary command execution is forbidden in attended integration groundwork'
          }
