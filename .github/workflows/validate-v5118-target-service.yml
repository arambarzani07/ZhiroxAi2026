name: Validate v5.1.18 scoped update service
on:
  pull_request:
    branches: [main]
    paths:
      - 'ops/supabase/release-snapshots/zhirox-pc-update-v510-production-v518.ts'
      - '.github/workflows/validate-v5118-target-service.yml'
  push:
    branches: [main]
    paths:
      - 'ops/supabase/release-snapshots/zhirox-pc-update-v510-production-v518.ts'
      - '.github/workflows/validate-v5118-target-service.yml'
permissions:
  contents: read
jobs:
  verify-scoped-update-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check 'ops/supabase/release-snapshots/zhirox-pc-update-v510-production-v518.ts'
