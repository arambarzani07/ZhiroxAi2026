name: Remote Input v2 Protocol Safety

on:
  push:
    branches:
      - feature/remote-input-v2-attended
    paths:
      - 'remote/agent-v1/control_protocol_v2.go'
      - 'remote/agent-v1/control_protocol_v2_test.go'
      - 'remote/agent-v1/capabilities_v2.go'
      - 'remote/agent-v1/capabilities_v2_test.go'
      - 'remote/consent-v1/capabilities_v2.go'
      - 'remote/consent-v1/capabilities_v2_test.go'
      - 'remote/controller-v1/control_v2.js'
      - 'remote/controller-v1/control_v2.test.cjs'
      - '.github/workflows/remote-input-v2-protocol.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'
          cache: false
      - name: Run agent protocol tests
        working-directory: remote/agent-v1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go mod tidy
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code -- go.mod
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run consent disclosure tests
        working-directory: remote/consent-v1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          go test ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run controller encoder tests
        working-directory: remote/controller-v1
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          node control_v2.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Enforce attended-only phase boundary
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $protocol = Get-Content 'remote/agent-v1/control_protocol_v2.go' -Raw
          if ($protocol -notmatch 'MaxControlEvents') { throw 'bounded control batch missing' }
          if ($protocol -notmatch 'replayed or out of order') { throw 'sequence/replay gate missing' }
          $caps = Get-Content 'remote/agent-v1/capabilities_v2.go' -Raw
          if ($caps -notmatch 'RequiresInputApproval') { throw 'explicit input approval contract missing' }
          if ($caps -notmatch 'clipboard, file transfer, and audio are disabled in phase 2') { throw 'phase 2 capability boundary missing' }
          $consentCaps = Get-Content 'remote/consent-v1/capabilities_v2.go' -Raw
          if ($consentCaps -notmatch 'screen-input') { throw 'input capability disclosure mode missing' }
          if ($consentCaps -notmatch 'control the mouse and keyboard') { throw 'approval text must explicitly disclose mouse and keyboard control' }
          $controller = Get-Content 'remote/controller-v1/control_v2.js' -Raw
          if ($controller -notmatch 'BLOCKED_KEYS') { throw 'controller blocked system-key gate missing' }
          if ($controller -notmatch 'MAX_EVENTS = 32') { throw 'controller event batch bound missing' }
          $canary = Get-Content 'remote/agent-v1/canary_signaling.go' -Raw
          if ($canary -notmatch '"clipboard":\s+false') { throw 'clipboard must remain disabled' }
          if ($canary -notmatch '"file_transfer":\s+false') { throw 'file transfer must remain disabled' }
          if ($canary -notmatch '"audio":\s+false') { throw 'audio must remain disabled' }
          $consent = Get-Content 'remote/consent-v1/main_windows.go' -Raw
          if ($consent -notmatch 'Yes/No approval') { throw 'local approval boundary missing' }
