name: Verify v5.1.7 Production Updater

on:
  push:
    branches:
      - release/v517-remote-screen-canary
    paths:
      - '.github/workflows/verify-v517-production-updater.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Verify promoted production updater health
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error --retry 2 --retry-all-errors --connect-timeout 10 --max-time 90 \
            'https://vllwundrtrgdqmkqbduy.supabase.co/functions/v1/zhirox-pc-update-v510-production/health' > health.json
          python3 - <<'PY'
          import json
          r=json.load(open('health.json',encoding='utf-8'))
          assert r.get('ok') is True, r
          assert r.get('version') == '5.1.7', r
          assert r.get('sha256') == 'eb2937c13aba7b4edfa4e38ab0a0198cd1910e03d1ecbae614cd8d9d51c1d91e', r
          assert int(r.get('size')) == 19912704, r
          assert r.get('signature') == 'ed25519_verified', r
          assert r.get('release_status') == 'promoted', r
          assert r.get('publishable') is True, r
          assert r.get('attended_screen_only') is True, r
          assert r.get('remote_input') is False, r
          assert r.get('unattended_access') is False, r
          print('PASS: production updater v9 is serving verified v5.1.7 release')
          PY
