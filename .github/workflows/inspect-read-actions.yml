name: Inspect update actions

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-read-actions.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          mkdir -p buildsrc
          cat source-v5.0.1.part001 source-v5.0.1.part002 source-v5.0.1.part003 | base64 -d > /tmp/zhirox-source.tar.gz
          tar -xzf /tmp/zhirox-source.tar.gz -C buildsrc
      - name: Inspect supported update actions
        run: |
          grep -Rni -E 'checkForUpdate|autoUpdateLoop|self.?update|update.*action|case ".*update|updater' buildsrc/*.go | head -250
          echo '--- command switch ---'
          grep -Rni -B5 -A10 'case "' buildsrc/*.go | head -700
