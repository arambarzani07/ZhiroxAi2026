name: Inspect read actions

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-read-actions.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          mkdir -p buildsrc
          cat source-v5.0.1.part001 source-v5.0.1.part002 source-v5.0.1.part003 | base64 -d > /tmp/zhirox-source.tar.gz
          tar -xzf /tmp/zhirox-source.tar.gz -C buildsrc
      - name: Inspect exact read implementations
        run: |
          echo '--- main.go lines 760-850 ---'
          nl -ba buildsrc/main.go | sed -n '760,850p'
          echo '--- allowedPath lines 600-660 ---'
          nl -ba buildsrc/main.go | sed -n '600,660p'
