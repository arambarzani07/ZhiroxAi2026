name: Inspect command loop

on:
  push:
    branches: [main]
    paths: ['.github/workflows/inspect-read-actions.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore source
        run: |
          mkdir -p buildsrc
          cat source-v5.0.1.part001 source-v5.0.1.part002 source-v5.0.1.part003 | base64 -d > /tmp/zhirox-source.tar.gz
          tar -xzf /tmp/zhirox-source.tar.gz -C buildsrc
      - name: Inspect command result loop
        run: |
          grep -Rni -E 'postResult|resultURL|nextCommand|commandLoop|poll|executeCommand|sendResult|/result|/next' buildsrc/*.go | head -250
          echo '--- loop context 2000-2100 ---'
          nl -ba buildsrc/main.go | sed -n '1980,2105p'
